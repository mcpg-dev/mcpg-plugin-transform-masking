[package]
name = "mcpg-plugin-transform-masking"
version = "0.1.0-alpha.16"
license = "Apache-2.0"
edition = "2024"
description = "MCPG Wasm transform plugin — masks sensitive fields (PII, secrets)"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.41"

[package.metadata.component]
package = "mcpg:masking-plugin"
